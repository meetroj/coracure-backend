# Coracure API - TLS termination and reverse proxy.
#
# nginx replaces the ALB that DEPLOYMENT.md assumed. The consequences of that
# swap are not cosmetic and are handled below:
#
#   * TRUST_PROXY=true makes Fastify believe X-Forwarded-For. That header is now
#     set HERE and nowhere else, so `audit_log` and the IP on a `consents` row
#     record the real client rather than 127.0.0.1. A client-supplied
#     X-Forwarded-For is overwritten, not appended to - otherwise anyone could
#     forge the address in a clinical audit trail.
#   * There is no target group draining a rolling deploy, so a restart IS a
#     brief outage. Keep the container's stop grace longer than a request.

upstream coracure_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP: only two jobs - answer the ACME challenge, and send everything else to
# TLS. The challenge location must stay ABOVE the redirect, or certbot's
# validation request gets 301'd and renewal fails silently until the cert
# expires.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Replaced by certbot once a real domain points here. Until then this is a
    # self-signed placeholder: browsers warn, and React Native REFUSES it
    # outright, so the mobile apps cannot use this endpoint until a certificate
    # for a real domain is issued.
    ssl_certificate     /etc/nginx/ssl/coracure-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/coracure-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The API returns JSON only; uploads and downloads are S3 signed URLs the
    # client uses directly, so no request body of consequence passes through
    # here. 2m is generous for a JSON payload and small enough to be a limit.
    client_max_body_size 2m;

    # Pino writes JSON to stdout for CloudWatch; these are nginx's own.
    access_log /var/log/nginx/coracure.access.log;
    error_log  /var/log/nginx/coracure.error.log;

    location / {
        proxy_pass http://coracure_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Assignment, not append: $proxy_add_x_forwarded_for would prepend
        # whatever the client claimed, and Fastify trusts the left-most entry.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # The payment and LiveKit webhooks verify an HMAC over the exact bytes
        # received. Buffering does not alter them, but any rewriting would, so
        # nothing here touches the body.
        proxy_request_buffering on;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Liveness only - checks nothing. Never point a health monitor at this and
    # conclude the service is healthy; /health/ready runs SELECT 1.
    location = /api/v1/health {
        proxy_pass http://coracure_api;
        access_log off;
    }
}
